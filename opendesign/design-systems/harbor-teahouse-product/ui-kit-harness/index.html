<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Harbor Teahouse · UI Kit</title>
  <link rel="stylesheet" href="../tokens/colors_and_type.css">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:40px;color:var(--harbor-ivory);background:var(--harbor-ink-950);font-family:var(--harbor-body)}main{max-width:1100px;margin:auto}.eyebrow{color:var(--harbor-brass);font-size:10px;letter-spacing:.2em}h1,h2{font-family:var(--harbor-display);font-weight:550}h1{font-size:42px;margin:8px 0 32px}section{padding:24px 0;border-top:1px solid var(--harbor-line)}.row{display:flex;flex-wrap:wrap;gap:12px}.swatch{width:138px;height:92px;padding:12px;border:1px solid var(--harbor-line);display:flex;align-items:flex-end;font-size:11px}.panel{width:280px;min-height:130px;padding:18px;border:1px solid var(--harbor-line);background:var(--harbor-ink-800);border-radius:var(--harbor-radius-panel)}button{min-height:42px;padding:0 18px;border:1px solid var(--harbor-line-strong);border-radius:var(--harbor-radius-control);color:var(--harbor-ivory);background:var(--harbor-ink-750);font-weight:650}button.primary{border-color:var(--harbor-tide);background:#1b5552}button.danger{border-color:var(--harbor-coral);color:#f4c6bd;background:#3a2222}button:disabled{opacity:.38}.status{display:inline-flex;gap:7px;align-items:center;padding:6px 10px;border:1px solid var(--harbor-line);border-radius:99px;color:var(--harbor-mist);font-size:11px}.status i{width:7px;height:7px;border-radius:50%;background:var(--harbor-tide)}.card{width:88px;height:126px;padding:10px;border:1px solid var(--harbor-line-strong);border-top-color:var(--harbor-brass);background:var(--harbor-ink-750);display:grid;align-content:space-between}.card b{font:32px var(--harbor-display)}small,p{color:var(--harbor-mist);line-height:1.6}</style>
</head>
<body><main>
  <span class="eyebrow">DSH / PRODUCT SYSTEM</span><h1>深夜港湾 · 茶歇间</h1>
  <section><h2>颜色</h2><div class="row"><div class="swatch" style="background:#071014">Ink 950</div><div class="swatch" style="background:#102027">Panel</div><div class="swatch" style="background:#66c9bf;color:#071014">Tide</div><div class="swatch" style="background:#d7aa63;color:#071014">Brass</div><div class="swatch" style="background:#d97d6c;color:#071014">Coral</div></div></section>
  <section><h2>操作与状态</h2><div class="row"><button class="primary">继续下潜</button><button>收帆 · 带回 12 分</button><button class="danger">结束本手</button><button disabled>等待澜音</button><span class="status"><i></i>你的潜航</span></div></section>
  <section><h2>游戏牌面</h2><div class="row"><div class="card"><span>≋</span><b>5</b><small>潮汐</small></div><div class="card"><span>◇</span><b>3</b><small>灯焰</small></div><div class="panel"><span class="eyebrow">CURRENT DECISION</span><h2>下一步由你决定</h2><p>继续获取收益，或把已经得到的分数安全带回港湾。</p></div></div></section>
</main></body></html>
